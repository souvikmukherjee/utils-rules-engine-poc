[project]
name = "rules-api"
version = "0.1.0"
description = "FastAPI platform around GoRules Zen (governance, entitlements, audit)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "rules-engine",
  "pydantic>=2.0",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rules_api"]
