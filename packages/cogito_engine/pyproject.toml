[project]
name = "cogito-engine"
version = "0.1.0"
description = "Cogito — native condition-IR rules engine (parallel to GoRules Zen)"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cogito_engine"]

[tool.hatch.build.targets.wheel.force-include]
"src/cogito_engine/samples/lounge_pack.json" = "cogito_engine/samples/lounge_pack.json"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
