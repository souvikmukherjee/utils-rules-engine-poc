[project]
name = "rules-engine"
version = "0.2.0"
description = "GoRules Zen adapter with platform entitlements, traces, and testgen"
requires-python = ">=3.11"
dependencies = [
  "zen-engine>=0.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rules_engine"]

[tool.hatch.build.targets.wheel.force-include]
"src/rules_engine/samples/lounge_pack.json" = "rules_engine/samples/lounge_pack.json"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
