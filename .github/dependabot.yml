version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, security]
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: pip
    directories:
      - /
      - /apps/api
      - /packages/rules_engine
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      - /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: maven
    directories:
      - /apps/kogito
      - /apps/spring-compare
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]
